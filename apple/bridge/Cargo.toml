[package]
name = "filmcraft-apple"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Fork-only crate: its own workspace so the upstream workspace manifest stays untouched.
[workspace]

[lib]
crate-type = ["staticlib", "lib"]
name = "filmcraft_apple"

[dependencies]
filmcraft-engine = { path = "../../crates/engine" }
filmcraft-media = { path = "../../crates/media" }
filmcraft-format = { path = "../../crates/format" }
serde_json = "1"
uniffi = "0.32"
thiserror = "2"

[features]
# Only needed to run the `uniffi-bindgen` binary (Swift binding generation); never shipped in the app.
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
